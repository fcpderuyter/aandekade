name: Site backup
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create site archive
        run: |
          zip -r aandekade-site.zip . -x ".git/*" "aandekade-site.zip"
      - name: Upload site archive
        uses: actions/upload-artifact@v4
        with:
          name: aandekade-site
          path: aandekade-site.zip
          if-no-files-found: error
